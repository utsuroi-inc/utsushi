<!DOCTYPE html>
<html lang="ja" data-i18n-document-title="optionsTitle">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>makimono</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf7;
    --fg: #222;
    --muted: #6b6660;
    --line: #d9d4cb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --fg: #eee;
      --muted: #a09a91;
      --line: #3a352f;
    }
  }

  body {
    margin: 0 auto;
    padding: 48px 24px 96px;
    max-width: 640px;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 40px;
  }
  h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin: 40px 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .field {
    margin: 24px 0;
  }
  .field > label,
  .field > .label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin: 4px 0 0;
  }
  input[type="text"],
  select {
    font: inherit;
    font-size: 14px;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    width: 100%;
    box-sizing: border-box;
  }
  select {
    width: auto;
    min-width: 240px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  input[type="range"] {
    flex: 1;
    max-width: 320px;
  }
  .value {
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-width: 5em;
  }
  .check {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .check input {
    margin-top: 5px;
  }
  code {
    font-size: 12px;
    background: color-mix(in srgb, var(--fg) 8%, transparent);
    padding: 1px 5px;
    border-radius: 4px;
  }
  footer {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }
  button {
    font: inherit;
    font-size: 13px;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover {
    border-color: var(--muted);
  }
  #saved {
    font-size: 13px;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.2s;
  }
  #saved.visible {
    opacity: 1;
  }
  a {
    color: inherit;
    font-size: 13px;
  }
</style>
</head>
<body>
  <h1 data-i18n="optionsHeading"></h1>

  <h2 data-i18n="optionsSectionCapture"></h2>

  <div class="field">
    <label for="captureDelay" data-i18n="optionsCaptureDelay"></label>
    <div class="row">
      <input type="range" id="captureDelay" min="200" max="2000" step="50" />
      <span class="value" id="captureDelayValue"></span>
    </div>
    <p class="hint" data-i18n="optionsCaptureDelayHint"></p>
  </div>

  <div class="field">
    <div class="check">
      <input type="checkbox" id="hideFixedElements" />
      <div>
        <label for="hideFixedElements" data-i18n="optionsHideFixed"></label>
        <p class="hint" data-i18n="optionsHideFixedHint"></p>
      </div>
    </div>
  </div>

  <div class="field">
    <div class="check">
      <input type="checkbox" id="preScroll" />
      <div>
        <label for="preScroll" data-i18n="optionsPreScroll"></label>
        <p class="hint" data-i18n="optionsPreScrollHint"></p>
      </div>
    </div>
  </div>

  <h2 data-i18n="optionsSectionExport"></h2>

  <div class="field">
    <label for="imageFormat" data-i18n="optionsImageFormat"></label>
    <select id="imageFormat">
      <option value="png" data-i18n="optionsFormatPng"></option>
      <option value="jpeg" data-i18n="optionsFormatJpeg"></option>
    </select>
    <p class="hint" data-i18n="optionsImageFormatHint"></p>
  </div>

  <div class="field">
    <label for="jpegQuality" data-i18n="optionsJpegQuality"></label>
    <div class="row">
      <input type="range" id="jpegQuality" min="0.5" max="1" step="0.01" />
      <span class="value" id="jpegQualityValue"></span>
    </div>
  </div>

  <div class="field">
    <label for="pdfPaper" data-i18n="optionsPdfPaper"></label>
    <select id="pdfPaper">
      <option value="image" data-i18n="optionsPdfPaperImage"></option>
      <option value="a4" data-i18n="optionsPdfPaperA4"></option>
    </select>
  </div>

  <div class="field">
    <label for="filenameTemplate" data-i18n="optionsFilenameTemplate"></label>
    <input type="text" id="filenameTemplate" spellcheck="false" />
    <p class="hint" data-i18n="optionsFilenameHint"></p>
    <p class="hint" id="filenamePreview"></p>
  </div>

  <div class="field">
    <div class="label" data-i18n="optionsShortcut"></div>
    <p class="hint"><code id="shortcut"></code></p>
    <p class="hint" data-i18n="optionsShortcutHint"></p>
  </div>

  <footer>
    <button id="reset" data-i18n="optionsReset"></button>
    <span id="saved" data-i18n="optionsSaved"></span>
    <a id="licenses" href="licenses/README.md" target="_blank" rel="noopener" data-i18n="optionsLicenses"></a>
  </footer>

  <script src="options.js"></script>
</body>
</html>
